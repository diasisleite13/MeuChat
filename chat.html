
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Familia Leite</title>
<link rel="stylesheet" href="css/style.css">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 0;
    height: 100vh;
    overflow: hidden;
    background: #080f1d;
    color: #f4f7fc;
}

.app {
    width: 100%;
    max-width: 1250px;
    height: 94vh;
    margin: 3vh auto;
    display: flex;
    overflow: hidden;
    background: #111d30;
    border: 1px solid #263951;
    border-radius: 18px;
}

.sidebar {
    width: 330px;
    min-width: 280px;
    display: flex;
    flex-direction: column;
    border-right: 1px solid #263951;
    background: #111d30;
}

.sidebar-header {
    padding: 22px;
    border-bottom: 1px solid #263951;
}

.brand {
    color: #168cff;
    font-size: 27px;
    font-weight: bold;
    margin: 0 0 15px;
}

.profile-area {
    display: flex;
    align-items: center;
    gap: 12px;
}

.avatar {
    width: 48px;
    height: 48px;
    min-width: 48px;
    border-radius: 50%;
    object-fit: cover;
    background: #1a2a42;
    border: 2px solid #168cff;
}

.avatar-placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 21px;
}

.user-name {
    color: #f4f7fc;
    font-size: 14px;
}

.photo-button {
    display: inline-block;
    margin-top: 6px;
    color: #168cff;
    font-size: 12px;
    cursor: pointer;
}

#photoInput,
#imageInput {
    display: none;
}

.search-box {
    padding: 12px 15px;
}

.search-box input {
    width: 100%;
    margin: 0;
    background: #080f1d;
    border: 1px solid #263951;
    color: white;
}

.contacts-title {
    padding: 10px 18px;
    color: #94a8c2;
    font-size: 13px;
    font-weight: bold;
}

#contacts {
    flex: 1;
    overflow-y: auto;
    padding: 5px 10px;
}

.contact {
    padding: 12px;
    margin: 5px 0;
    border-radius: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: transparent;
    color: white;
    border: 1px solid transparent;
    cursor: pointer;
}

.contact:hover {
    background: #1a2a42;
}

.contact.active {
    background: #183b60;
    border-color: #168cff;
}

.contact .avatar {
    width: 42px;
    height: 42px;
    min-width: 42px;
}

.contact-name {
    font-weight: bold;
}

.contact-subtitle {
    color: #94a8c2;
    font-size: 12px;
    margin-top: 5px;
}

.sidebar-footer {
    padding: 15px;
    border-top: 1px solid #263951;
}

.sidebar-footer button {
    width: 100%;
    background: #1a2a42;
    color: #ff8b8b;
}

.main-chat {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    background: #080f1d;
}

.chat-header {
    min-height: 75px;
    padding: 18px 22px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid #263951;
    background: #111d30;
}

.chat-header h2 {
    margin: 0;
    font-size: 18px;
}

.chat-header p {
    margin: 5px 0 0;
    color: #20c997;
    font-size: 12px;
}

#messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 22px;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: #080f1d;
}

.message-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    max-width: 85%;
    width: fit-content;
}

.message-row.mine {
    align-self: flex-end;
    flex-direction: row-reverse;
}

.message-row.theirs {
    align-self: flex-start;
}

.message-avatar {
    width: 34px;
    height: 34px;
    min-width: 34px;
    border-radius: 50%;
    object-fit: cover;
    background: #1a2a42;
    border: 1px solid #168cff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    color: white;
}

.message {
    max-width: calc(100% - 42px);
    width: fit-content;
    padding: 12px 16px;
    margin: 0;
    border-radius: 14px;
    overflow-wrap: anywhere;
    line-height: 1.5;
}

.mine .message {
    background: #087fe5;
    color: white;
    border-bottom-right-radius: 4px;
}

.theirs .message {
    background: #1a2a42;
    color: white;
    border-bottom-left-radius: 4px;
}

.message-time {
    font-size: 10px;
    text-align: right;
    opacity: 0.75;
    margin-top: 5px;
    line-height: 1.2;
}

.message-image {
    display: block;
    width: 100%;
    max-width: 320px;
    max-height: 320px;
    object-fit: contain;
    border-radius: 9px;
    cursor: pointer;
}

.message-audio {
    display: block;
    width: 250px;
    max-width: 100%;
    height: 42px;
}

.image-button {
    width: 48px;
    min-width: 48px;
    margin: 0;
    padding: 10px;
    background: #1a2a42;
    color: white;
    font-size: 20px;
    cursor: pointer;
}

.audio-button {
    width: 48px;
    min-width: 48px;
    margin: 0;
    padding: 10px;
    background: #1a2a42;
    color: white;
    font-size: 20px;
    cursor: pointer;
}

.audio-button.recording {
    background: #c62828;
    animation: pulse 1s infinite;
}

@keyframes pulse {
    50% { opacity: 0.55; }
}

.image-button:disabled,
.audio-button:disabled,
.send-area button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.send-area {
    display: flex;
    gap: 10px;
    padding: 15px;
    background: #111d30;
    border-top: 1px solid #263951;
}

.send-area input[type="text"] {
    flex: 1;
    min-width: 0;
    margin: 0;
    background: #080f1d;
    color: white;
}

.send-area button {
    margin: 0;
    width: auto;
}

.welcome-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 25px;
    text-align: center;
    color: #94a8c2;
}

.welcome-screen .symbol {
    font-size: 65px;
    margin-bottom: 15px;
}

.welcome-screen h2 {
    color: #168cff;
}

#conversation {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
}

#status {
    padding: 5px 15px;
    margin: 0;
    color: #94a8c2;
    background: #111d30;
    font-size: 12px;
}

#backBtn {
    display: none;
}

@media (max-width: 650px) {
    .app {
        height: 100vh;
        margin: 0;
        border: none;
        border-radius: 0;
    }

    .sidebar {
        width: 100%;
        min-width: 0;
        border-right: none;
    }

    .main-chat {
        display: none;
        width: 100%;
    }

    .app.chat-open .sidebar {
        display: none;
    }

    .app.chat-open .main-chat {
        display: flex;
    }

    #backBtn {
        display: inline-block;
        margin-right: 4px;
        padding: 10px 13px;
    }

    .chat-header {
        padding: 12px;
    }

    #messages {
        padding: 14px 10px;
    }

    .message-row {
        max-width: 95%;
    }

    .message {
        max-width: calc(100% - 42px);
    }

    .send-area {
        padding: 10px;
        gap: 6px;
    }

    .image-button,
    .audio-button {
        width: 40px;
        min-width: 40px;
        padding: 8px;
    }

    .message-image {
        max-width: 230px;
        max-height: 260px;
    }

    .message-audio {
        width: 210px;
    }
}
</style>
</head>

<body>

<div class="app" id="app">

    <aside class="sidebar">

        <div class="sidebar-header">
            <h1 class="brand">MeuChat 💬</h1>

            <div class="profile-area">
                <div id="myAvatar" class="avatar avatar-placeholder">👤</div>

                <div>
                    <div class="user-name" id="welcome">
                        Carregando usuário...
                    </div>

                    <label class="photo-button" for="photoInput">
                        📷 Alterar foto
                    </label>

                    <input type="file" id="photoInput" accept="image/*">
                </div>
            </div>
        </div>

        <div class="search-box">
            <input
                type="search"
                id="searchContact"
                placeholder="Buscar contato..."
            >
        </div>

        <div class="contacts-title">SEUS CONTATOS</div>

        <div id="contacts">Carregando contatos...</div>

        <div class="sidebar-footer">
            <button id="logoutBtn">Sair da conta</button>
        </div>

    </aside>

    <main class="main-chat">

        <div class="welcome-screen" id="emptyScreen">
            <div class="symbol">💬</div>
            <h2>Bem-vindo ao MeuChat!</h2>
            <p>Escolha um contato ao lado para começar uma conversa.</p>
        </div>

        <section id="conversation" style="display:none;">

            <header class="chat-header">
                <button id="backBtn" type="button">←</button>

                <img id="contactAvatar" class="avatar" alt="Foto do contato">

                <div>
                    <h2 id="contactName">Conversa</h2>
                    <p>Conectado ao MeuChat</p>
                </div>
            </header>

            <div id="messages"></div>

            <form id="messageForm" class="send-area">

                <input
                    type="file"
                    id="imageInput"
                    accept="image/*"
                >

                <button
                    type="button"
                    id="imageButton"
                    class="image-button"
                    title="Enviar foto"
                    aria-label="Enviar foto"
                >📷</button>

                <button
                    type="button"
                    id="audioButton"
                    class="audio-button"
                    title="Gravar áudio"
                    aria-label="Gravar áudio"
                >🎙️</button>

                <input
                    type="text"
                    id="messageInput"
                    placeholder="Digite sua mensagem..."
                    maxlength="2000"
                    required
                >

                <button type="submit">Enviar ➤</button>

            </form>

        </section>

        <p id="status"></p>

    </main>

</div>

<script type="module">

import { auth, db } from "./js/firebase.js";

import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
    collection,
    getDocs,
    doc,
    getDoc,
    setDoc,
    addDoc,
    query,
    orderBy,
    onSnapshot,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const app = document.getElementById("app");
const welcome = document.getElementById("welcome");
const contacts = document.getElementById("contacts");
const conversation = document.getElementById("conversation");
const emptyScreen = document.getElementById("emptyScreen");
const contactName = document.getElementById("contactName");
const contactAvatar = document.getElementById("contactAvatar");
const messages = document.getElementById("messages");
const messageForm = document.getElementById("messageForm");
const messageInput = document.getElementById("messageInput");
const status = document.getElementById("status");
const searchContact = document.getElementById("searchContact");
const photoInput = document.getElementById("photoInput");
const imageInput = document.getElementById("imageInput");
const imageButton = document.getElementById("imageButton");
const audioButton = document.getElementById("audioButton");

let currentUser = null;
let currentConversationId = null;
let currentContactId = null;
let unsubscribeMessages = null;
let unsubscribeUsers = null;
let allContacts = [];
let userPhotos = {};

/* CONTROLE DA GRAVAÇÃO */

let mediaRecorder = null;
let audioChunks = [];
let recordingTimer = null;
let isRecording = false;

/* LOGIN */

onAuthStateChanged(auth, async (user) => {

    if (!user) {
        window.location.href = "login.html";
        return;
    }

    currentUser = user;

    try {

        const userRef = doc(db, "users", user.uid);
        const userSnapshot = await getDoc(userRef);

        if (!userSnapshot.exists()) {

            const nome = user.email
                ? user.email.split("@")[0]
                : "Usuário";

            await setDoc(userRef, {
                name: nome,
                online: true,
                photoURL: ""
            });

            welcome.textContent = "Olá, " + nome + "!";
            userPhotos[user.uid] = "";

        } else {

            const dados = userSnapshot.data();

            welcome.textContent = "Olá, " + dados.name + "!";

            userPhotos[user.uid] = dados.photoURL || "";

            if (dados.photoURL) {
                const img = document.createElement("img");
                img.src = dados.photoURL;
                img.className = "avatar";
                img.alt = "Minha foto";

                document.getElementById("myAvatar").replaceWith(img);
                img.id = "myAvatar";
            }

        }

        await loadContacts();

    } catch (error) {

        console.error(error);
        status.textContent = "Erro: " + error.message;

    }

});

/* CARREGAR CONTATOS */

async function loadContacts() {

    contacts.textContent = "Carregando contatos...";

    const snapshot = await getDocs(collection(db, "users"));

    allContacts = [];

    snapshot.forEach((item) => {

        const data = item.data();

        userPhotos[item.id] = data.photoURL || "";

        if (item.id === currentUser.uid) return;

        allContacts.push({
            id: item.id,
            name: data.name || "Usuário",
            photoURL: data.photoURL || ""
        });

    });

    renderContacts(allContacts);

    if (unsubscribeUsers) unsubscribeUsers();

    unsubscribeUsers = onSnapshot(collection(db, "users"), (usersSnapshot) => {

        allContacts = [];

        usersSnapshot.forEach((item) => {

            const data = item.data();

            userPhotos[item.id] = data.photoURL || "";

            if (item.id === currentUser.uid) return;

            allContacts.push({
                id: item.id,
                name: data.name || "Usuário",
                photoURL: data.photoURL || ""
            });

        });

        const term = searchContact.value.toLowerCase().trim();

        renderContacts(allContacts.filter(person =>
            person.name.toLowerCase().includes(term)
        ));

        if (currentContactId) {
            const selected = allContacts.find(p => p.id === currentContactId);

            if (selected) {
                contactAvatar.src = selected.photoURL || "";
                contactAvatar.style.display = selected.photoURL ? "block" : "none";
            }
        }

    });

}

/* MOSTRAR CONTATOS */

function renderContacts(list) {

    contacts.innerHTML = "";

    if (list.length === 0) {
        contacts.textContent = "Nenhum contato encontrado.";
        return;
    }

    list.forEach((person) => {

        const contact = document.createElement("div");
        contact.className = "contact";

        if (person.id === currentContactId) {
            contact.classList.add("active");
        }

        if (person.photoURL) {

            const img = document.createElement("img");
            img.src = person.photoURL;
            img.className = "avatar";
            img.alt = "Foto de " + person.name;
            contact.appendChild(img);

        } else {

            const avatar = document.createElement("div");
            avatar.className = "avatar avatar-placeholder";
            avatar.textContent = person.name.charAt(0).toUpperCase();
            contact.appendChild(avatar);

        }

        const info = document.createElement("div");

        const name = document.createElement("div");
        name.className = "contact-name";
        name.textContent = person.name;

        const subtitle = document.createElement("div");
        subtitle.className = "contact-subtitle";
        subtitle.textContent = "Toque para conversar";

        info.appendChild(name);
        info.appendChild(subtitle);

        contact.appendChild(info);

        contact.addEventListener("click", () => {
            openConversation(person.id, person.name);
        });

        contacts.appendChild(contact);

    });

}

/* BUSCAR CONTATOS */

searchContact.addEventListener("input", () => {

    const term = searchContact.value.toLowerCase().trim();

    const filtered = allContacts.filter(person =>
        person.name.toLowerCase().includes(term)
    );

    renderContacts(filtered);

});

/* COMPRIMIR FOTO DE PERFIL */

function compressImage(file) {

    return new Promise((resolve, reject) => {

        const reader = new FileReader();

        reader.onload = () => {

            const image = new Image();

            image.onload = () => {

                const canvas = document.createElement("canvas");
                const maxSize = 256;

                let width = image.width;
                let height = image.height;

                if (width > height) {
                    if (width > maxSize) {
                        height = Math.round(height * maxSize / width);
                        width = maxSize;
                    }
                } else {
                    if (height > maxSize) {
                        width = Math.round(width * maxSize / height);
                        height = maxSize;
                    }
                }

                canvas.width = width;
                canvas.height = height;

                const context = canvas.getContext("2d");
                context.drawImage(image, 0, 0, width, height);

                resolve(canvas.toDataURL("image/jpeg", 0.65));

            };

            image.onerror = reject;
            image.src = reader.result;

        };

        reader.onerror = reject;
        reader.readAsDataURL(file);

    });

}

/* ESCOLHER E SALVAR FOTO DE PERFIL */

photoInput.addEventListener("change", async () => {

    const file = photoInput.files[0];

    if (!file) return;

    if (!file.type.startsWith("image/")) {
        status.textContent = "Escolha um arquivo de imagem.";
        photoInput.value = "";
        return;
    }

    status.textContent = "Preparando sua foto...";

    try {

        const photo = await compressImage(file);

        const userRef = doc(db, "users", currentUser.uid);

        await setDoc(userRef, {
            photoURL: photo
        }, { merge: true });

        userPhotos[currentUser.uid] = photo;

        const oldAvatar = document.getElementById("myAvatar");

        const newAvatar = document.createElement("img");
        newAvatar.id = "myAvatar";
        newAvatar.className = "avatar";
        newAvatar.src = photo;
        newAvatar.alt = "Minha foto";

        oldAvatar.replaceWith(newAvatar);

        status.textContent = "Foto de perfil atualizada!";
        photoInput.value = "";

    } catch (error) {

        console.error(error);
        status.textContent = "Erro ao salvar foto: " + error.message;

    }

});

/* COMPRIMIR FOTO DA CONVERSA */

function compressChatImage(file) {

    return new Promise((resolve, reject) => {

        const reader = new FileReader();

        reader.onload = () => {

            const image = new Image();

            image.onload = () => {

                const maxSize = 600;

                let width = image.width;
                let height = image.height;

                if (width > height && width > maxSize) {
                    height = Math.round(height * maxSize / width);
                    width = maxSize;
                } else if (height > maxSize) {
                    width = Math.round(width * maxSize / height);
                    height = maxSize;
                }

                const canvas = document.createElement("canvas");
                canvas.width = width;
                canvas.height = height;

                const context = canvas.getContext("2d");
                context.drawImage(image, 0, 0, width, height);

                const result = canvas.toDataURL("image/jpeg", 0.50);

                if (result.length > 850000) {
                    reject(new Error(
                        "Essa imagem ficou muito grande. Escolha uma foto menor."
                    ));
                    return;
                }

                resolve(result);

            };

            image.onerror = () => {
                reject(new Error("Não foi possível abrir essa imagem."));
            };

            image.src = reader.result;

        };

        reader.onerror = () => {
            reject(new Error("Não foi possível ler o arquivo."));
        };

        reader.readAsDataURL(file);

    });

}

/* BOTÃO PARA ESCOLHER IMAGEM */

imageButton.addEventListener("click", () => {

    if (!currentConversationId) {
        status.textContent = "Abra uma conversa primeiro.";
        return;
    }

    imageInput.click();

});

/* ENVIAR IMAGEM */

imageInput.addEventListener("change", async () => {

    const file = imageInput.files[0];

    if (!file) return;

    if (!file.type.startsWith("image/")) {
        status.textContent = "Escolha um arquivo de imagem.";
        imageInput.value = "";
        return;
    }

    if (!currentConversationId) {
        status.textContent = "Abra uma conversa primeiro.";
        imageInput.value = "";
        return;
    }

    try {

        imageButton.disabled = true;
        status.textContent = "Comprimindo imagem...";

        const imageData = await compressChatImage(file);

        status.textContent = "Enviando foto...";

        await addDoc(
            collection(
                db,
                "conversations",
                currentConversationId,
                "messages"
            ),
            {
                type: "image",
                text: "",
                imageData: imageData,
                senderId: currentUser.uid,
                createdAt: serverTimestamp()
            }
        );

        status.textContent = "Foto enviada com sucesso!";

    } catch (error) {

        console.error(error);
        status.textContent = "Erro ao enviar foto: " + error.message;

    } finally {

        imageButton.disabled = false;
        imageInput.value = "";

    }

});

/* TRANSFORMAR ÁUDIO EM BASE64 */

function audioToBase64(blob) {

    return new Promise((resolve, reject) => {

        const reader = new FileReader();

        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(
            new Error("Não foi possível preparar o áudio.")
        );

        reader.readAsDataURL(blob);

    });

}

/* GRAVAR E ENVIAR ÁUDIO */

audioButton.addEventListener("click", async () => {

    if (!currentConversationId) {
        status.textContent = "Abra uma conversa primeiro.";
        return;
    }

    /* Se já estiver gravando, parar */

    if (isRecording) {

        if (mediaRecorder && mediaRecorder.state === "recording") {
            mediaRecorder.stop();
        }

        return;
    }

    /* Verificar suporte do navegador */

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia ||
        !window.MediaRecorder
    ) {
        status.textContent =
            "Seu navegador não oferece suporte à gravação de áudio ou precisa de HTTPS.";
        return;
    }

    try {

        audioButton.disabled = true;
        status.textContent = "Solicitando acesso ao microfone...";

        const stream = await navigator.mediaDevices.getUserMedia({
            audio: true
        });

        /* Escolher formato de áudio compatível */

        let options = {};

        const formatos = [
            "audio/webm;codecs=opus",
            "audio/webm",
            "audio/mp4"
        ];

        for (const formato of formatos) {
            if (MediaRecorder.isTypeSupported(formato)) {
                options = { mimeType: formato };
                break;
            }
        }

        const gravador = new MediaRecorder(stream, options);

        mediaRecorder = gravador;
        audioChunks = [];

        const conversationAtStart = currentConversationId;

        gravador.ondataavailable = (event) => {

            if (event.data && event.data.size > 0) {
                audioChunks.push(event.data);
            }

        };

        gravador.onerror = (event) => {

            console.error(event);
            status.textContent = "Erro durante a gravação do áudio.";

        };

        gravador.onstop = async () => {

            clearTimeout(recordingTimer);

            isRecording = false;
            audioButton.textContent = "🎙️";
            audioButton.classList.remove("recording");
            audioButton.disabled = true;

            /* Liberar o microfone */

            stream.getTracks().forEach(track => track.stop());

            try {

                if (audioChunks.length === 0) {
                    status.textContent = "Nenhum áudio foi gravado.";
                    return;
                }

                const audioBlob = new Blob(audioChunks, {
                    type: gravador.mimeType || "audio/webm"
                });

                if (audioBlob.size === 0) {
                    status.textContent = "O áudio ficou vazio. Tente novamente.";
                    return;
                }

                status.textContent = "Preparando áudio...";

                const audioData = await audioToBase64(audioBlob);

                /* Limite para não ultrapassar o documento Firestore */

                if (audioData.length > 850000) {
                    status.textContent =
                        "Áudio muito grande. Grave um áudio mais curto.";
                    return;
                }

                status.textContent = "Enviando áudio...";

                await addDoc(
                    collection(
                        db,
                        "conversations",
                        conversationAtStart,
                        "messages"
                    ),
                    {
                        type: "audio",
                        text: "",
                        audioData: audioData,
                        senderId: currentUser.uid,
                        createdAt: serverTimestamp()
                    }
                );

                status.textContent = "Áudio enviado com sucesso! 🎙️";

            } catch (error) {

                console.error(error);
                status.textContent =
                    "Erro ao enviar áudio: " + error.message;

            } finally {

                audioChunks = [];
                mediaRecorder = null;
                audioButton.disabled = false;

            }

        };

        gravador.start();

        isRecording = true;

        audioButton.textContent = "⏹️";
        audioButton.classList.add("recording");
        audioButton.disabled = false;

        status.textContent =
            "🔴 Gravando... toque no botão para parar. Máximo de 20 segundos.";

        /* Parar automaticamente após 20 segundos */

        recordingTimer = setTimeout(() => {

            if (
                mediaRecorder &&
                mediaRecorder.state === "recording"
            ) {
                mediaRecorder.stop();
            }

        }, 20000);

    } catch (error) {

        console.error(error);

        audioButton.disabled = false;

        if (error.name === "NotAllowedError") {
            status.textContent =
                "Você precisa permitir o acesso ao microfone.";
        } else if (error.name === "NotFoundError") {
            status.textContent =
                "Nenhum microfone foi encontrado.";
        } else {
            status.textContent =
                "Não foi possível iniciar a gravação: " + error.message;
        }

    }

});

/* ABRIR CONVERSA */

async function openConversation(otherUserId, name) {

    try {

        status.textContent = "Abrindo conversa...";

        const participants = [
            currentUser.uid,
            otherUserId
        ].sort();

        currentConversationId = participants.join("_");
        currentContactId = otherUserId;

        const conversationRef = doc(
            db,
            "conversations",
            currentConversationId
        );

        const conversationSnapshot = await getDoc(conversationRef);

        if (!conversationSnapshot.exists()) {

            await setDoc(conversationRef, {
                participants: participants,
                createdAt: serverTimestamp()
            });

        }

        contactName.textContent = name;

        const photo = userPhotos[otherUserId] || "";

        if (photo) {
            contactAvatar.src = photo;
            contactAvatar.style.display = "block";
        } else {
            contactAvatar.removeAttribute("src");
            contactAvatar.style.display = "none";
        }

        emptyScreen.style.display = "none";
        conversation.style.display = "flex";
        app.classList.add("chat-open");

        status.textContent = "";

        renderContacts(allContacts);

        if (unsubscribeMessages) {
            unsubscribeMessages();
        }

        const messagesQuery = query(
            collection(
                db,
                "conversations",
                currentConversationId,
                "messages"
            ),
            orderBy("createdAt", "asc")
        );

        unsubscribeMessages = onSnapshot(
            messagesQuery,
            (snapshot) => {

                messages.innerHTML = "";

                snapshot.forEach((item) => {

                    const data = item.data();
                    const senderId = data.senderId;
                    const isMine = senderId === currentUser.uid;

                    const horario = data.createdAt?.toDate
                        ? data.createdAt.toDate().toLocaleTimeString(
                            "pt-BR",
                            {
                                hour: "2-digit",
                                minute: "2-digit"
                            }
                        )
                        : "";

                    const row = document.createElement("div");

                    row.className = "message-row " +
                        (isMine ? "mine" : "theirs");

                    /* FOTO DO REMETENTE */

                    const avatarPhoto = userPhotos[senderId] || "";

                    let avatar;

                    if (avatarPhoto) {

                        avatar = document.createElement("img");
                        avatar.src = avatarPhoto;
                        avatar.alt = "Foto de perfil";
                        avatar.className = "message-avatar";

                    } else {

                        avatar = document.createElement("div");
                        avatar.className = "message-avatar";

                        const sender = allContacts.find(
                            person => person.id === senderId
                        );

                        const senderName = isMine
                            ? welcome.textContent.replace("Olá, ", "").replace("!", "")
                            : (sender ? sender.name : "U");

                        avatar.textContent = senderName.charAt(0).toUpperCase();

                    }

                    /* BALÃO DA MENSAGEM */

                    const bubble = document.createElement("div");
                    bubble.className = "message";

                    if (data.type === "image" && data.imageData) {

                        const image = document.createElement("img");

                        image.src = data.imageData;
                        image.alt = "Imagem enviada na conversa";
                        image.className = "message-image";

                        image.addEventListener("click", () => {
                            window.open(data.imageData, "_blank");
                        });

                        bubble.appendChild(image);

                    } else if (data.type === "audio" && data.audioData) {

                        const audio = document.createElement("audio");

                        audio.controls = true;
                        audio.preload = "metadata";
                        audio.src = data.audioData;
                        audio.className = "message-audio";

                        bubble.appendChild(audio);

                    } else {

                        const messageText = document.createElement("div");
                        messageText.textContent = data.text || "";

                        bubble.appendChild(messageText);

                    }

                    const messageTime = document.createElement("div");
                    messageTime.className = "message-time";
                    messageTime.textContent = horario;

                    bubble.appendChild(messageTime);

                    row.appendChild(avatar);
                    row.appendChild(bubble);

                    messages.appendChild(row);

                });

                messages.scrollTop = messages.scrollHeight;

            },
            (error) => {

                console.error(error);
                status.textContent =
                    "Erro ao carregar mensagens: " + error.message;

            }
        );

    } catch (error) {

        console.error(error);
        status.textContent =
            "Erro ao abrir conversa: " + error.message;

    }

}

/* ENVIAR TEXTO */

messageForm.addEventListener("submit", async (event) => {

    event.preventDefault();

    const text = messageInput.value.trim();

    if (!text || !currentConversationId) return;

    try {

        await addDoc(
            collection(
                db,
                "conversations",
                currentConversationId,
                "messages"
            ),
            {
                type: "text",
                text: text,
                senderId: currentUser.uid,
                createdAt: serverTimestamp()
            }
        );

        messageInput.value = "";
        status.textContent = "";

    } catch (error) {

        console.error(error);
        status.textContent = "Erro ao enviar: " + error.message;

    }

});

/* VOLTAR */

document.getElementById("backBtn").addEventListener("click", () => {

    if (unsubscribeMessages) {
        unsubscribeMessages();
        unsubscribeMessages = null;
    }

    conversation.style.display = "none";
    emptyScreen.style.display = "flex";
    app.classList.remove("chat-open");

    currentConversationId = null;
    currentContactId = null;

    renderContacts(allContacts);

});

/* SAIR */

document.getElementById("logoutBtn").addEventListener("click", async () => {

    if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
    }

    if (unsubscribeMessages) unsubscribeMessages();
    if (unsubscribeUsers) unsubscribeUsers();

    await signOut(auth);
    window.location.href = "login.html";

});
