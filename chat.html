
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Família Leite - Entrar</title>

    <!-- CONFIGURAÇÃO PWA -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#071a33">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Família Leite">
    <link rel="apple-touch-icon" href="./icon-192.png">

    <link rel="stylesheet" href="css/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #080f1d;
            font-family: Arial, Helvetica, sans-serif;
            color: #f4f7fc;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 30px;
            background: #111d30;
            border: 1px solid #263951;
            border-radius: 16px;
        }

        .login-container h1 {
            color: #168cff;
            text-align: center;
            margin-top: 0;
        }

        .login-container p {
            text-align: center;
            color: #94a8c2;
        }

        .login-container input {
            width: 100%;
            margin: 8px 0;
            padding: 13px;
            background: #080f1d;
            color: white;
            border: 1px solid #263951;
            border-radius: 9px;
        }

        .login-container input:focus {
            border-color: #168cff;
            outline: none;
        }

        .login-container button {
            width: 100%;
            margin-top: 12px;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #087fe5;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .login-container button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #registerBtn {
            background: #1a2a42;
        }

        #installButton {
            display: none;
            background: #168cff;
            border: 1px solid #319cff;
        }

        #installButton.visible {
            display: block;
        }

        #message {
            min-height: 22px;
            overflow-wrap: anywhere;
            font-size: 13px;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #71849e;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h1>Família Leite 💬</h1>

        <p>Converse com sua família!</p>

        <form id="loginForm">

            <input
                type="text"
                id="name"
                placeholder="Seu nome (para cadastro)"
                autocomplete="name"
            >

            <input
                type="email"
                id="email"
                placeholder="Seu e-mail"
                autocomplete="email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Sua senha"
                autocomplete="current-password"
                required
            >

            <button type="submit" id="loginBtn">
                Entrar
            </button>

            <button type="button" id="registerBtn">
                Criar minha conta
            </button>

        </form>

        <!-- BOTÃO DE INSTALAÇÃO -->
        <button type="button" id="installButton">
            📲 Instalar Família Leite
        </button>

        <p id="message"></p>

        <div class="footer">
            Família Leite © 2026
        </div>

    </div>

    <!-- AUTENTICAÇÃO FIREBASE -->
    <script type="module" src="./js/auth.js"></script>

    <!-- CONFIGURAÇÃO PWA -->
    <script>
        let installPrompt = null;

        const installButton =
            document.getElementById("installButton");

        // REGISTRAR SERVICE WORKER
        if ("serviceWorker" in navigator) {

            window.addEventListener("load", async () => {

                try {

                    await navigator.serviceWorker.register(
                        "./service-worker.js"
                    );

                    console.log(
                        "Família Leite: Service Worker registrado!"
                    );

                } catch (error) {

                    console.error(
                        "Erro ao registrar Service Worker:",
                        error
                    );

                }

            });

        }

        // DETECTAR INSTALAÇÃO DISPONÍVEL
        window.addEventListener(
            "beforeinstallprompt",
            (event) => {

                event.preventDefault();

                installPrompt = event;

                installButton.classList.add("visible");

            }
        );

        // INSTALAR APLICATIVO
        installButton.addEventListener("click", async () => {

            if (!installPrompt) {
                return;
            }

            installPrompt.prompt();

            const result = await installPrompt.userChoice;

            console.log(
                "Resultado da instalação:",
                result.outcome
            );

            installPrompt = null;

            installButton.classList.remove("visible");

        });

        // INSTALAÇÃO CONCLUÍDA
        window.addEventListener("appinstalled", () => {

            installPrompt = null;

            installButton.classList.remove("visible");

            console.log(
                "Família Leite instalado com sucesso!"
            );

        });

        // VERIFICAR SE JÁ ESTÁ INSTALADO
        const isStandalone =
            window.matchMedia("(display-mode: standalone)").matches ||
            window.navigator.standalone === true;

        if (isStandalone) {
            installButton.classList.remove("visible");
        }
    </script>

</body>
</html>
